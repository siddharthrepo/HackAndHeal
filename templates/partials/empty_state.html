{% comment %}
Args: icon (fa class), title, hint, cta_url, cta_label
{% endcomment %}
<div class="text-center py-8 px-4">
  <div class="mx-auto h-12 w-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-3">
    <i class="fas {{ icon|default:'fa-inbox' }} text-slate-400 dark:text-slate-500"></i>
  </div>
  <p class="text-sm font-medium text-slate-700 dark:text-slate-200">{{ title }}</p>
  {% if hint %}<p class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{ hint }}</p>{% endif %}
  {% if cta_url %}
  <a href="{{ cta_url }}" class="inline-flex items-center gap-1 mt-4 text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-700">
    {{ cta_label|default:"Get started" }} <i class="fas fa-arrow-right text-xs"></i>
  </a>
  {% endif %}
</div>

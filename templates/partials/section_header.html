{% comment %}
Args: title, eyebrow (small caps label), action_url, action_label
{% endcomment %}
<div class="flex items-end justify-between mb-4">
  <div>
    {% if eyebrow %}<p class="text-[11px] uppercase tracking-[0.18em] text-indigo-500 dark:text-indigo-400 font-semibold mb-1">{{ eyebrow }}</p>{% endif %}
    <h2 class="text-lg font-semibold text-slate-900 dark:text-white">{{ title }}</h2>
  </div>
  {% if action_url %}
  <a href="{{ action_url }}" class="text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 inline-flex items-center gap-1">
    {{ action_label|default:"View all" }} <i class="fas fa-arrow-right text-[10px]"></i>
  </a>
  {% endif %}
</div>

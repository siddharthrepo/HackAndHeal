{% comment %}
Avatar circle with initials.
Args: user, size (sm|md|lg), tone (indigo|emerald|violet|amber|slate)
{% endcomment %}
{% with size=size|default:"md" tone=tone|default:"indigo" %}
<span class="inline-flex items-center justify-center rounded-full font-semibold shrink-0
  {% if size == 'sm' %}h-8 w-8 text-xs{% elif size == 'lg' %}h-14 w-14 text-base{% else %}h-11 w-11 text-sm{% endif %}
  {% if tone == 'emerald' %}bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300
  {% elif tone == 'violet' %}bg-violet-100 text-violet-700 dark:bg-violet-900/40 dark:text-violet-300
  {% elif tone == 'amber' %}bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300
  {% elif tone == 'slate' %}bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-200
  {% else %}bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300{% endif %}">
  {{ user.get_full_name|default:user.email|slice:":2"|upper }}
</span>
{% endwith %}

name: Infrastructure Setup

on:
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Apply
        run: |
          cd infra
          terraform init -reconfigure -input=false
          terraform apply -auto-approve
          EC2_IP=$(terraform output -raw ec2_public_ip | tr -d '\n\r')
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV

      - name: Update DuckDNS record
        run: |
          echo "Updating DuckDNS to point healthmeter -> $EC2_IP"
          response=$(curl -s "https://www.duckdns.org/update?domains=healthmeter&token=${{ secrets.DUCKDNS_TOKEN }}&ip=$EC2_IP")
          echo "DuckDNS response: $response"
          if [ "$response" != "OK" ]; then
            echo "DuckDNS update failed" && exit 1
          fi

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible dnsutils

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for SSH
        # First connect uses the IP directly — DNS may not have propagated yet,
        # and we just need a TCP-level liveness signal before Ansible runs.
        run: |
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@$EC2_IP "echo SSH ready"; then
              exit 0
            fi
            echo "SSH not ready yet ($i/40), retrying in 5s..."
            sleep 5
          done
          echo "SSH never came up" && exit 1

      - name: Wait for DNS to point at this instance
        # Critical: certbot's HTTP-01 challenge resolves healthmeter.duckdns.org
        # via public DNS. If this returns an old IP, LE hits the wrong server
        # and validation fails. Poll an authoritative resolver until it agrees.
        run: |
          for i in $(seq 1 30); do
            resolved=$(dig +short @1.1.1.1 healthmeter.duckdns.org A | tail -1)
            echo "Attempt $i: resolved=$resolved expected=$EC2_IP"
            if [ "$resolved" = "$EC2_IP" ]; then
              echo "DNS propagated."
              exit 0
            fi
            sleep 5
          done
          echo "DNS did not propagate to $EC2_IP within 150s" && exit 1

      - name: Generate Ansible inventory
        # Use the hostname (not the IP). Ansible's SSH does a fresh DNS lookup
        # each connect — so if the EC2 IP ever changes, the next workflow run
        # picks it up automatically as long as DuckDNS is current.
        run: |
          cat > ansible/inventory.ini <<EOF
          [web]
          healthmeter.duckdns.org ansible_user=ubuntu
          EOF

      - name: Run Ansible (Docker)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml \
            --private-key ~/.ssh/id_rsa \
            --ssh-common-args "-o StrictHostKeyChecking=no"

      - name: Run Ansible (Nginx + HTTPS)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/nginx.yml \
            --private-key ~/.ssh/id_rsa \
            --ssh-common-args "-o StrictHostKeyChecking=no"

      - name: Done
        run: |
          echo "✅ Infrastructure ready at https://healthmeter.duckdns.org"
          echo "Now run the 'Deploy Application' workflow to ship code."

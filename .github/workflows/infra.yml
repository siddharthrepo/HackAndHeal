name: Infrastructure Setup

on:
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Apply
        run: |
          cd infra
          terraform init -reconfigure -input=false
          terraform apply -auto-approve
          EC2_IP=$(terraform output -raw ec2_public_ip | tr -d '\n\r')
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV

      - name: Update DuckDNS record
        run: |
          echo "Updating DuckDNS to point healthmeter -> $EC2_IP"
          curl -s "https://www.duckdns.org/update?domains=healthmeter&token=${{ secrets.DUCKDNS_TOKEN }}&ip=$EC2_IP"
          echo

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for SSH
        run: |
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@$EC2_IP "echo SSH ready"; then
              exit 0
            fi
            echo "SSH not ready yet ($i/40), retrying in 5s..."
            sleep 5
          done
          echo "SSH never came up" && exit 1

      - name: Generate Ansible inventory
        run: |
          cat > ansible/inventory.ini <<EOF
          [web]
          $EC2_IP ansible_user=ubuntu
          EOF

      - name: Run Ansible (Docker)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml \
            --private-key ~/.ssh/id_rsa \
            --ssh-common-args "-o StrictHostKeyChecking=no"

      - name: Run Ansible (Nginx + HTTPS)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/nginx.yml \
            --private-key ~/.ssh/id_rsa \
            --ssh-common-args "-o StrictHostKeyChecking=no"

      - name: Done
        run: |
          echo "✅ Infrastructure ready at https://healthmeter.duckdns.org"
          echo "Now run the 'Deploy Application' workflow to ship code."

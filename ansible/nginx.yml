- name: Configure Nginx + HTTPS for HealthMeter
  hosts: web
  become: true

  vars:
    domain_name: healthmeter.duckdns.org
    contact_email: siddharthraturi12@gmail.com
    app_dir: /home/ubuntu/healthmeter

  tasks:
    - name: Install Nginx and Certbot
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Deploy Nginx site config
      template:
        src: templates/healthmeter.nginx.j2
        dest: /etc/nginx/sites-available/healthmeter
      notify: reload nginx

    - name: Enable HealthMeter site
      file:
        src: /etc/nginx/sites-available/healthmeter
        dest: /etc/nginx/sites-enabled/healthmeter
        state: link
        force: yes

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    # Always re-run certbot. The previous task overwrites the nginx config from
    # our template, which wipes out the SSL block certbot adds. Re-running with
    # --keep-until-expiring is safe: Let's Encrypt won't re-issue a current cert,
    # certbot just re-applies the SSL block to the nginx config and reloads.
    - name: Obtain / re-apply Let's Encrypt cert (idempotent)
      command: >
        certbot --nginx
        -d {{ domain_name }}
        --non-interactive
        --agree-tos
        -m {{ contact_email }}
        --redirect
        --keep-until-expiring

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

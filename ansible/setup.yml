- name: Setup EC2 for HealthMeter app
  hosts: web
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker, helpers
      apt:
        name:
          - docker.io
          - curl
          - cron
        state: present

    # Compose V2 (Go plugin) — Ubuntu's apt `docker-compose` is the EOL Python v1
    # which crashes with `KeyError: 'ContainerConfig'` on modern Docker engines.
    - name: Ensure Docker CLI plugins dir exists
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Install docker compose v2 plugin
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"
        force: no   # only download if missing

    - name: Enable and start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ensure app directory exists
      file:
        path: /home/ubuntu/healthmeter
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Ensure cron is enabled
      systemd:
        name: cron
        state: started
        enabled: yes

    # ── Swap (defensive against OOM on t2.micro: 1 GB RAM is tight) ──
    - name: Check if swapfile already exists
      stat:
        path: /swapfile
      register: swapfile_stat

    - name: Allocate 2 GB swap file
      command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile
      when: not swapfile_stat.stat.exists

    - name: Lock down swapfile permissions
      file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Format swap
      command: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Get currently-active swap devices
      command: swapon --show=NAME --noheadings
      register: active_swap
      changed_when: false
      failed_when: false   # exit 0 even when no swap is active

    - name: Enable swap (active until reboot)
      command: swapon /swapfile
      when: "'/swapfile' not in (active_swap.stdout | default(''))"

    - name: Persist swap across reboots
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    - name: Tune swappiness (prefer RAM, only swap under real pressure)
      sysctl:
        name: vm.swappiness
        value: "10"
        state: present
        reload: yes
